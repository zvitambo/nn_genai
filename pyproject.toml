[project]
name = "nn-genai-assessment"
version = "0.1.0"
description = "Nationale-Nederlanden GenAI Engineer assessment"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "langchain-google-genai>=4.4,<5.0",
    "google-genai",
    "python-dotenv",
   
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
